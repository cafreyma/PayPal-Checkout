<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Basic Apple Pay — JS SDK v6</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
    }
    #applepay-button {
      display: block;
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 6px;
      background: #000;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }
    #applepay-button:disabled {
      background: #888;
      cursor: not-allowed;
    }
    #result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      background: #f6f6f6;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.8rem;
      display: none;
    }
    #status {
      color: #666;
      font-size: 0.85rem;
    }
    .product {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      margin: 0 auto 20px;
    }
    .product-image {
      flex-shrink: 0;
    }
    .product-info h2 {
      margin: 0;
      font-size: 1rem;
    }
    .product-info p {
      margin: 2px 0 0;
      color: #666;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="product">
    <svg class="product-image" width="88" height="88" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="T-shirt">
      <rect width="100" height="100" rx="16" fill="#eef2fb" />
      <path d="M35 12 L50 20 L65 12 L82 22 L74 38 L66 34 L66 88 L34 88 L34 34 L26 38 L18 22 Z" fill="#5b8def" stroke="#2f5fc4" stroke-width="2" stroke-linejoin="round" />
    </svg>
    <div class="product-info">
      <h2>Classic Cotton Tee</h2>
      <p>S$0.10 SGD</p>
    </div>
  </div>

  <button id="applepay-button" hidden>Checkout with Apple Pay</button>

  <p id="status">Loading SDK…</p>
  <div id="result"></div>

  <script>
    function showResult(text) {
      const result = document.getElementById("result");
      result.style.display = "block";
      result.textContent = text;
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    async function getClientToken() {
      const res = await fetch("/api/client-token");
      const { access_token } = await res.json();
      return access_token;
    }

    async function createOrder() {
      const res = await fetch("/api/orders", { method: "POST" });
      const order = await res.json();
      return order.id;
    }

    async function captureOrder(orderId) {
      const res = await fetch(`/api/orders/${orderId}/capture`, { method: "POST" });
      const details = await res.json();
      showResult(JSON.stringify(details, null, 2));
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load ${src}`));
        document.body.appendChild(script);
      });
    }

    async function main() {
      try {
        // Step 1 — Load the PayPal Web SDK (core + brand bundles)
        await loadScript("https://www.sandbox.paypal.com/web-sdk/v6/core");
        await loadScript("https://www.sandbox.paypal.com/web-sdk/v6/brand");

        // Step 2 — Get a browser-safe client token from the backend
        const clientToken = await getClientToken();
        const clientMetadataId = crypto.randomUUID();

        // Step 3 — Create an SDK instance with the applepay-payments component
        const sdkInstance = await window.paypal.createInstance({
          clientToken,
          clientMetadataId,
          components: ["applepay-payments"],
        });

        // Step 4 — Check Apple Pay eligibility
        // NOTE: forced visible for demo purposes even when isEligible()/canMakePayments() fail —
        // normally you should gate session creation and rendering on both checks.
        const eligibility = await sdkInstance.findEligibleMethods({
          currencyCode: "SGD",
        });
        if (!eligibility.isEligible("basic_apple_pay")) {
          setStatus("Apple Pay is not eligible for this merchant/currency in sandbox (forced visible for demo).");
        }

        // Step 5 — Create the Basic Apple Pay payment session
        const applePayPaymentSession = sdkInstance.createBasicApplePayOneTimePaymentSession({
          onApprove: async ({ orderId }) => {
            setStatus("");
            await captureOrder(orderId);
          },
          onCancel: () => setStatus("Apple Pay payment cancelled."),
          onError: (error) => showResult("Error: " + (error.message || error)),
        });

        // Step 6 — Confirm device/browser support
        // NOTE: canMakePayments() throws (rather than resolving false) when the page
        // isn't served over HTTPS. Caught here so the button still shows for demo
        // purposes — it won't actually be able to start a session.
        let canMakePayments = false;
        try {
          canMakePayments = await applePayPaymentSession.canMakePayments();
        } catch (error) {
          setStatus("Apple Pay check failed (forced visible for demo): " + (error.message || error));
        }
        if (!canMakePayments) {
          setStatus("Apple Pay is not available on this device/browser (forced visible for demo).");
        }

        const button = document.getElementById("applepay-button");
        button.hidden = false;
        if (canMakePayments) setStatus("");

        // Step 7 — Render button; on click, create an order and start the session
        button.addEventListener("click", async () => {
          button.disabled = true;
          try {
            const checkoutSessionOptionsPromise = createOrder().then((orderId) => ({ orderId }));
            await applePayPaymentSession.start({}, checkoutSessionOptionsPromise);
          } catch (error) {
            showResult("Error: " + (error.message || error));
          } finally {
            button.disabled = false;
          }
        });
      } catch (error) {
        setStatus("");
        showResult("Error: " + (error.message || error));
      }
    }

    main();
  </script>
  <script>
    function reportHeightToParent() {
      window.parent.postMessage(
        { type: "checkout-demo-resize", height: document.documentElement.scrollHeight },
        window.location.origin
      );
    }
    new ResizeObserver(reportHeightToParent).observe(document.documentElement);
    window.addEventListener("load", reportHeightToParent);
  </script>
</body>
</html>
