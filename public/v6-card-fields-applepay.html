<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Standard Checkout — JS SDK v6 (Card Fields) + Basic Apple Pay</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
    }
    #paypal-button-slot {
      width: 100%;
      margin-bottom: 20px;
    }
    #marks-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
    }
    .mark-icon {
      flex-shrink: 0;
    }
    paypal-button {
      display: block;
      width: 100%;
    }
    .card-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    #card-name,
    .card-field {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 4px 8px;
      height: 44px;
      box-sizing: border-box;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .card-row {
      display: flex;
      gap: 10px;
    }
    .card-row .card-field {
      flex: 1 1 0;
      min-width: 0;
    }
    #card-submit {
      margin-top: 4px;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #0070ba;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      width: 100%;
      height: 55px;
    }
    #card-submit:disabled {
      background: #99c2e0;
      cursor: not-allowed;
    }
    #applepay-section {
      margin-top: 20px;
    }
    apple-pay-mark {
      display: block;
      height: 24px;
      width: auto;
      position: relative;
      top: -7px;
    }
    #applepay-button {
      display: block;
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 6px;
      background: #000;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }
    #applepay-button:disabled {
      background: #888;
      cursor: not-allowed;
    }
    #applepay-note {
      color: #888;
      font-size: 0.8rem;
      margin: 4px 0 0;
    }
    #result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      background: #f6f6f6;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.8rem;
      display: none;
    }
    #status {
      color: #666;
      font-size: 0.85rem;
    }
    .product {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      margin: 0 auto 20px;
    }
    .product-image {
      flex-shrink: 0;
    }
    .product-info h2 {
      margin: 0;
      font-size: 1rem;
    }
    .product-info p {
      margin: 2px 0 0;
      color: #666;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="product">
    <svg class="product-image" width="88" height="88" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="T-shirt">
      <rect width="100" height="100" rx="16" fill="#eef2fb" />
      <path d="M35 12 L50 20 L65 12 L82 22 L74 38 L66 34 L66 88 L34 88 L34 34 L26 38 L18 22 Z" fill="#5b8def" stroke="#2f5fc4" stroke-width="2" stroke-linejoin="round" />
    </svg>
    <div class="product-info">
      <h2>Classic Cotton Tee</h2>
      <p>$10.00 USD</p>
    </div>
  </div>

  <!-- v6 Web Components has no SDK-provided "mark" for PayPal/Card (unlike v5's paypal.Marks()),
       so those two use custom icons; Apple Pay uses the real <apple-pay-mark> from the brand bundle. -->
  <div id="marks-row">
    <svg class="mark-icon" width="60" height="20" viewBox="0 0 60 20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PayPal">
      <rect width="60" height="20" rx="4" fill="#003087" />
      <text x="30" y="14" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fff">PayPal</text>
    </svg>
    <svg class="mark-icon" width="30" height="20" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Card">
      <rect x="0.5" y="0.5" width="29" height="19" rx="3" fill="#fff" stroke="#999" />
      <rect x="0.5" y="4.5" width="29" height="3" fill="#555" />
    </svg>
    <apple-pay-mark id="apple-pay-mark" hidden></apple-pay-mark>
  </div>

  <div id="paypal-button-slot">
    <paypal-button hidden></paypal-button>
  </div>

  <form class="card-form" id="card-form" hidden>
    <input id="card-name" type="text" placeholder="Name on card" autocomplete="cc-name" />
    <div id="card-number" class="card-field"></div>
    <div class="card-row">
      <div id="card-expiry" class="card-field"></div>
      <div id="card-cvv" class="card-field"></div>
    </div>
    <button type="submit" id="card-submit">Pay with Card</button>
  </form>

  <div id="applepay-section" hidden>
    <button id="applepay-button" hidden>Checkout with Apple Pay</button>
  </div>
  <p id="applepay-note" hidden></p>

  <p id="status">Loading SDK…</p>
  <div id="result"></div>

  <script>
    function showResult(text) {
      const result = document.getElementById("result");
      result.style.display = "block";
      result.textContent = text;
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function setApplePayNote(text) {
      const note = document.getElementById("applepay-note");
      note.hidden = !text;
      note.textContent = text;
    }

    async function createOrder() {
      const res = await fetch("/api/orders", { method: "POST" });
      const order = await res.json();
      return { orderId: order.id };
    }

    async function captureOrder(orderId) {
      const res = await fetch(`/api/orders/${orderId}/capture`, { method: "POST" });
      const details = await res.json();
      showResult(JSON.stringify(details, null, 2));
    }

    async function getClientToken() {
      const res = await fetch("/api/client-token");
      const { access_token } = await res.json();
      return access_token;
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load ${src}`));
        document.body.appendChild(script);
      });
    }

    async function main() {
      // Step 1 — Load the PayPal Web SDK (core + brand, for <apple-pay-mark>)
      await loadScript("https://www.sandbox.paypal.com/web-sdk/v6/core");
      await loadScript("https://www.sandbox.paypal.com/web-sdk/v6/brand");
      init().catch((error) => {
        setStatus("");
        showResult("Error initializing SDK: " + (error.message || error));
      });
    }

    async function init() {
      // Step 2 — Get a client token (required for the applepay-payments component)
      const clientToken = await getClientToken();
      const clientMetadataId = crypto.randomUUID();

      // Step 3 — Create a single SDK instance covering PayPal/Card Fields + Apple Pay
      const sdkInstance = await window.paypal.createInstance({
        clientToken,
        clientMetadataId,
        components: ["paypal-payments", "card-fields", "applepay-payments"],
        pageType: "checkout",
      });

      // Step 4 — Check eligibility for all methods
      const eligibility = await sdkInstance.findEligibleMethods({
        currencyCode: "USD",
      });

      let anyEligible = false;

      if (eligibility.isEligible("paypal")) {
        anyEligible = true;
        const button = document.querySelector("paypal-button");
        button.hidden = false;

        const paypalSession = sdkInstance.createPayPalOneTimePaymentSession({
          onApprove: async (data) => {
            await captureOrder(data.orderId);
          },
          onCancel: () => setStatus("Payment cancelled."),
          onError: (error) => showResult("Error: " + error),
        });

        button.addEventListener("click", async () => {
          await paypalSession.start({ presentationMode: "auto" }, createOrder());
        });
      }

      if (eligibility.isEligible("advanced_cards")) {
        anyEligible = true;
        setUpCardFields(sdkInstance);
      }

      // Step 5 — Create the Basic Apple Pay payment session
      // NOTE: forced visible for demo purposes even when isEligible()/canMakePayments() fail —
      // normally you should gate session creation and rendering on both checks.
      if (!eligibility.isEligible("basic_apple_pay")) {
        setApplePayNote("Apple Pay is not eligible for this merchant/currency in sandbox (forced visible for demo).");
      }

      const applePayPaymentSession = sdkInstance.createBasicApplePayOneTimePaymentSession({
        onApprove: async ({ orderId }) => {
          await captureOrder(orderId);
        },
        onCancel: () => setStatus("Apple Pay payment cancelled."),
        onError: (error) => showResult("Error: " + (error.message || error)),
      });

      // Step 6 — Confirm device/browser support before showing the mark
      let canMakePayments = false;
      try {
        canMakePayments = await applePayPaymentSession.canMakePayments();
      } catch (error) {
        setApplePayNote("Apple Pay check failed (forced visible for demo): " + (error.message || error));
      }
      if (!canMakePayments) {
        setApplePayNote("Apple Pay is not available on this device/browser (forced visible for demo).");
      }

      anyEligible = true;
      const section = document.getElementById("applepay-section");
      const mark = document.getElementById("apple-pay-mark");
      const button = document.getElementById("applepay-button");
      section.hidden = false;
      mark.hidden = false;
      button.hidden = false;

      // Step 7 — Separate button triggers checkout; the mark is display-only
      button.addEventListener("click", async () => {
        button.disabled = true;
        try {
          const checkoutSessionOptionsPromise = createOrder().then(({ orderId }) => ({ orderId }));
          await applePayPaymentSession.start({}, checkoutSessionOptionsPromise);
        } catch (error) {
          showResult("Error: " + (error.message || error));
        } finally {
          button.disabled = false;
        }
      });

      setStatus(anyEligible ? "" : "No payment methods eligible for this buyer/currency in sandbox.");
    }

    function setUpCardFields(sdkInstance) {
      const cardForm = document.getElementById("card-form");
      cardForm.hidden = false;

      const cardSession = sdkInstance.createCardFieldsOneTimePaymentSession();

      // v6 Card Fields only supports number/expiry/cvv — cardholder name is a plain input, not an SDK field
      const fieldStyle = { input: { border: "none", borderRadius: "0", padding: "0" } };
      const numberField = cardSession.createCardFieldsComponent({ type: "number", placeholder: "Card number", style: fieldStyle });
      const expiryField = cardSession.createCardFieldsComponent({ type: "expiry", placeholder: "MM/YY", style: fieldStyle });
      const cvvField = cardSession.createCardFieldsComponent({ type: "cvv", placeholder: "CVV", style: fieldStyle });

      document.getElementById("card-number").appendChild(numberField);
      document.getElementById("card-expiry").appendChild(expiryField);
      document.getElementById("card-cvv").appendChild(cvvField);

      cardForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const submitButton = document.getElementById("card-submit");
        submitButton.disabled = true;
        setStatus("Processing card payment…");

        try {
          const order = await createOrder();
          const cardholderName = document.getElementById("card-name").value;
          const { data, state } = await cardSession.submit(order.orderId, { cardholderName });

          if (state === "succeeded") {
            setStatus("");
            await captureOrder(data.orderId);
          } else if (state === "canceled") {
            setStatus("Card authentication cancelled. Please try again.");
          } else {
            showResult((data && data.message) || "Card payment failed.");
          }
        } catch (error) {
          showResult("Error: " + (error.message || error));
        } finally {
          submitButton.disabled = false;
        }
      });
    }

    main();
  </script>
  <script>
    function reportHeightToParent() {
      window.parent.postMessage(
        { type: "checkout-demo-resize", height: document.documentElement.scrollHeight },
        window.location.origin
      );
    }
    new ResizeObserver(reportHeightToParent).observe(document.documentElement);
    window.addEventListener("load", reportHeightToParent);
  </script>
</body>
</html>
