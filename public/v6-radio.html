<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Standard Checkout — JS SDK v6 (Radio: PayPal or Card)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
    }
    .method-picker {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
      border: none;
      padding: 0;
    }
    .method-option {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .method-option:has(input:checked) {
      border-color: #0070ba;
      box-shadow: 0 0 0 1px #0070ba;
    }
    .method-option:has(input:disabled) {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .method-option input {
      margin: 0;
    }
    .method-mark {
      flex-shrink: 0;
    }
    #paypal-section {
      width: 100%;
      margin-bottom: 20px;
    }
    paypal-button {
      display: block;
      width: 100%;
    }
    .card-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .card-form[hidden] {
      display: none;
    }
    #card-name {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .card-field {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 4px 8px;
      height: 44px;
    }
    .card-row {
      display: flex;
      gap: 10px;
    }
    .card-row .card-field {
      flex: 1 1 0;
      min-width: 0;
    }
    #card-submit {
      margin-top: 4px;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #0070ba;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      width: 100%;
      height: 55px;
    }
    #card-submit:disabled {
      background: #99c2e0;
      cursor: not-allowed;
    }
    #result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      background: #f6f6f6;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.8rem;
      display: none;
    }
    #status {
      color: #666;
      font-size: 0.85rem;
    }
    .product {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      margin: 0 auto 20px;
    }
    .product-image {
      flex-shrink: 0;
    }
    .product-info h2 {
      margin: 0;
      font-size: 1rem;
    }
    .product-info p {
      margin: 2px 0 0;
      color: #666;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="product">
    <svg class="product-image" width="88" height="88" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="T-shirt">
      <rect width="100" height="100" rx="16" fill="#eef2fb" />
      <path d="M35 12 L50 20 L65 12 L82 22 L74 38 L66 34 L66 88 L34 88 L34 34 L26 38 L18 22 Z" fill="#5b8def" stroke="#2f5fc4" stroke-width="2" stroke-linejoin="round" />
    </svg>
    <div class="product-info">
      <h2>Classic Cotton Tee</h2>
      <p>$10.00 USD</p>
    </div>
  </div>

  <!-- v6 Web Components has no SDK-provided "mark" for PayPal/Card (unlike v5's paypal.Marks()
       or v6's own <apple-pay-mark>), so these are custom icons, not official brand assets. -->
  <fieldset class="method-picker" id="method-picker">
    <label class="method-option">
      <input type="radio" name="payment-method" value="paypal" id="method-paypal" checked />
      <svg class="method-mark" width="60" height="20" viewBox="0 0 60 20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PayPal">
        <rect width="60" height="20" rx="4" fill="#003087" />
        <text x="30" y="14" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fff">PayPal</text>
      </svg>
    </label>
    <label class="method-option">
      <input type="radio" name="payment-method" value="card" id="method-card" />
      <svg class="method-mark" width="30" height="20" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Card">
        <rect x="0.5" y="0.5" width="29" height="19" rx="3" fill="#fff" stroke="#999" />
        <rect x="0.5" y="4.5" width="29" height="3" fill="#555" />
      </svg>
      Card
    </label>
  </fieldset>

  <div id="paypal-section">
    <paypal-button></paypal-button>
  </div>

  <form class="card-form" id="card-form" hidden>
    <input id="card-name" type="text" placeholder="Name on card" autocomplete="cc-name" />
    <div id="card-number" class="card-field"></div>
    <div class="card-row">
      <div id="card-expiry" class="card-field"></div>
      <div id="card-cvv" class="card-field"></div>
    </div>
    <button type="submit" id="card-submit">Pay with Card</button>
  </form>

  <p id="status">Loading SDK…</p>
  <div id="result"></div>

  <script>
    function showResult(text) {
      const result = document.getElementById("result");
      result.style.display = "block";
      result.textContent = text;
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    async function createOrder() {
      const res = await fetch("/api/orders", { method: "POST" });
      const order = await res.json();
      return { orderId: order.id };
    }

    async function captureOrder(orderId) {
      const res = await fetch(`/api/orders/${orderId}/capture`, { method: "POST" });
      const details = await res.json();
      showResult(JSON.stringify(details, null, 2));
    }

    // Radio buttons choose which payment UI is visible; both sessions are
    // already created up front, so switching methods needs no extra API calls.
    function selectMethod(method) {
      document.getElementById("paypal-section").hidden = method !== "paypal";
      document.getElementById("card-form").hidden = method !== "card";
    }

    async function main() {
      const configRes = await fetch("/api/config");
      const { clientId } = await configRes.json();

      const script = document.createElement("script");
      script.src = "https://www.sandbox.paypal.com/web-sdk/v6/core";
      script.onload = () => {
        init(clientId).catch((error) => {
          setStatus("");
          showResult("Error initializing SDK: " + (error.message || error));
        });
      };
      script.onerror = () => {
        setStatus("");
        showResult("Failed to load the PayPal JS SDK v6 script.");
      };
      document.body.appendChild(script);
    }

    async function init(clientId) {
      const sdkInstance = await window.paypal.createInstance({
        clientId,
        components: ["paypal-payments", "card-fields"],
        pageType: "checkout",
      });

      const eligibility = await sdkInstance.findEligibleMethods({
        currencyCode: "USD",
      });

      const paypalRadio = document.getElementById("method-paypal");
      const cardRadio = document.getElementById("method-card");
      let anyEligible = false;
      let defaultMethod = null;

      if (eligibility.isEligible("paypal")) {
        anyEligible = true;
        defaultMethod = defaultMethod || "paypal";
        setUpPayPalButton(sdkInstance);
      } else {
        paypalRadio.disabled = true;
      }

      if (eligibility.isEligible("advanced_cards")) {
        anyEligible = true;
        defaultMethod = defaultMethod || "card";
        setUpCardFields(sdkInstance);
      } else {
        cardRadio.disabled = true;
      }

      document.querySelectorAll('input[name="payment-method"]').forEach((radio) => {
        radio.addEventListener("change", () => selectMethod(radio.value));
      });

      if (defaultMethod) {
        document.getElementById(`method-${defaultMethod}`).checked = true;
        selectMethod(defaultMethod);
      } else {
        selectMethod(null);
      }

      setStatus(anyEligible ? "" : "No payment methods eligible for this buyer/currency in sandbox.");
    }

    function setUpPayPalButton(sdkInstance) {
      const button = document.querySelector("paypal-button");

      const paypalSession = sdkInstance.createPayPalOneTimePaymentSession({
        onApprove: async (data) => {
          await captureOrder(data.orderId);
        },
        onCancel: () => setStatus("Payment cancelled."),
        onError: (error) => showResult("Error: " + error),
      });

      button.addEventListener("click", async () => {
        await paypalSession.start({ presentationMode: "auto" }, createOrder());
      });
    }

    function setUpCardFields(sdkInstance) {
      const cardSession = sdkInstance.createCardFieldsOneTimePaymentSession();

      // v6 Card Fields only supports number/expiry/cvv — cardholder name is a plain input, not an SDK field
      const numberField = cardSession.createCardFieldsComponent({ type: "number", placeholder: "Card number" });
      const expiryField = cardSession.createCardFieldsComponent({ type: "expiry", placeholder: "MM/YY" });
      const cvvField = cardSession.createCardFieldsComponent({ type: "cvv", placeholder: "CVV" });

      document.getElementById("card-number").appendChild(numberField);
      document.getElementById("card-expiry").appendChild(expiryField);
      document.getElementById("card-cvv").appendChild(cvvField);

      const cardForm = document.getElementById("card-form");
      cardForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const submitButton = document.getElementById("card-submit");
        submitButton.disabled = true;
        setStatus("Processing card payment…");

        try {
          const order = await createOrder();
          const cardholderName = document.getElementById("card-name").value;
          const { data, state } = await cardSession.submit(order.orderId, { cardholderName });

          if (state === "succeeded") {
            setStatus("");
            await captureOrder(data.orderId);
          } else if (state === "canceled") {
            setStatus("Card authentication cancelled. Please try again.");
          } else {
            showResult((data && data.message) || "Card payment failed.");
          }
        } catch (error) {
          showResult("Error: " + (error.message || error));
        } finally {
          submitButton.disabled = false;
        }
      });
    }

    main();
  </script>
  <script>
    function reportHeightToParent() {
      window.parent.postMessage(
        { type: "checkout-demo-resize", height: document.documentElement.scrollHeight },
        window.location.origin
      );
    }
    new ResizeObserver(reportHeightToParent).observe(document.documentElement);
    window.addEventListener("load", reportHeightToParent);
  </script>
</body>
</html>
